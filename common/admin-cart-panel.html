<div id="admin-cart-overlay" class="cart-overlay"></div>
<div id="admin-cart-panel" class="cart-panel">
  <div class="cart-header">
    <h3>Order Cart</h3>
    <button class="close-cart" id="closeAdminCartBtn">&times;</button>
  </div>
  <div class="cart-items">
    <div class="empty-cart-message">
      Cart is empty
    </div>
  </div>
  <div class="cart-summary">
    <div class="cart-total">
      <span>Total:</span>
      <span class="total-amount">KSh 0</span>
    </div>
    <button class="checkout-btn" id="adminProceedCheckoutBtn">Update Order Summary</button>
    <button class="checkout-btn continue-shopping-btn" id="adminContinueShoppingBtn" type="button">Continue Editing</button>
  </div>
</div>
