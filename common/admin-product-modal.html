<div class="modal" id="adminProductModal">
  <div class="modal-content">
    <span class="close-modal" id="closeAdminProductModalBtn">&times;</span>
    <div class="modal-body">
      <div class="modal-images">
        <img src="assets/pishori-rice-bag.webp" alt="Pishori Rice" id="adminMainImage">
        <div class="thumbnail-container">
          <img src="assets/pishori-rice-bag.webp" alt="Pishori Rice" class="thumbnail">
          <img src="assets/pishori-rice-closeup.png" alt="Rice Closeup" class="thumbnail">
          <img src="assets/pishori-rice-cooked.png" alt="Cooked Rice" class="thumbnail">
        </div>
      </div>
      <div class="modal-details">
        <h2>Pishori Rice</h2>
        <p class="price">KES <span id="adminModalPrice">0</span> / <span id="adminModalPackageLabel">-</span></p>
        <p class="description">Premium quality Pishori rice directly from Mwea farms. Each grain is carefully selected for size and quality.</p>
        <div class="package-selector god-tier-select">
          <label for="adminPackage">Package:</label>
          <select id="adminPackage">
            <option value="">Select package</option>
          </select>
        </div>
        <div class="quantity-selector">
          <label for="adminQuantity">Quantity:</label>
          <input type="number" id="adminQuantity" min="1" value="1">
        </div>
        <div class="min-weight-note" style="color:#b8860b;font-size:1em;margin:0.5em 0 0.5em 0;">
          <i class="fas fa-info-circle"></i> Minimum order weight: 5kg
        </div>
        <p class="total-price">Total: KES <span id="adminTotalPrice">0</span></p>
        <button class="btn-primary" id="adminAddToCartBtn" disabled>Add to Cart</button>
      </div>
    </div>
  </div>
</div>
